name: Market Structure Scan

on:
  # Резервный запуск. Основной режим - цепочка: каждый запуск сам ставит следующий,
  # потому что расписание GitHub на деле срабатывало раз в ~8 часов вместо каждого часа.
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Показать найденные уведомления в журнале, не отправляя их"
        type: boolean
        default: false
      test_telegram:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

# Интервал цепочки: сразу после закрытия каждой 15м-свечи (в :01, :16, :31, :46 UTC)
env:
  RUN_EVERY_MIN: "15"
  OFFSET_SEC: "60"

# actions: write нужен, чтобы запуск мог поставить следующий запуск (цепочка)
# contents: write — только чтобы публиковать табло бота-конкурента в отдельную ветку duel-data (main не меняется)
permissions:
  contents: write
  actions: write

concurrency:
  group: market-structure-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}
          restore-keys: |
            market-structure-state-
      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SCAN_ALL: ${{ inputs.dry_run && '1' || '' }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}

      - name: Опубликовать результаты бота-конкурента
        # Только виртуальные сделки бота и список сигналов. Ветка duel-data, main не трогается.
        if: ${{ always() && !inputs.test_telegram && !inputs.dry_run && hashFiles('state/duel_public.json') != '' }}
        continue-on-error: true
        run: |
          git config user.name "duel-bot"
          git config user.email "duel-bot@users.noreply.github.com"
          if git fetch -q --depth 1 origin duel-data 2>/dev/null; then
            git worktree add -q /tmp/duel FETCH_HEAD
          else
            git worktree add -q --detach /tmp/duel
            git -C /tmp/duel checkout -q --orphan duel-data
            git -C /tmp/duel rm -rq . 2>/dev/null || true
          fi
          cp state/duel_public.json /tmp/duel/duel.json
          cd /tmp/duel
          git add duel.json
          if git diff --cached --quiet; then echo "Табло без изменений"; exit 0; fi
          git commit -qm "Табло бота-конкурента"
          git push -q origin HEAD:refs/heads/duel-data && echo "Табло опубликовано"

      - name: Следующий запуск (цепочка)
        # Следующий запуск ставится сразу и ждёт в очереди (concurrency), пока этот не закончится.
        # Этот запуск досыпает до ближайшего :01/:16/:31/:46 UTC и завершается - следующий стартует ровно после закрытия свечи.
        # Если цепочка оборвётся, её восстановит запуск по расписанию.
        # Тестовые и пробные запуски цепочку не продолжают.
        if: ${{ !cancelled() && !inputs.test_telegram && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          queued=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run scan.yml --ref "${{ github.ref_name }}"; then
              echo "Следующий запуск поставлен в очередь (попытка $attempt)"
              queued=1
              break
            fi
            echo "Попытка $attempt не удалась, повтор через 30 с"
            sleep 30
          done
          if [ "$queued" != "1" ]; then
            echo "Не удалось поставить следующий запуск. Цепочку восстановит запуск по расписанию."
            exit 1
          fi
          now=$(date +%s)
          period=$(( RUN_EVERY_MIN * 60 ))
          next=$(( ( (now - OFFSET_SEC + period - 1) / period ) * period + OFFSET_SEC ))
          wait=$(( next - now ))
          echo "Жду ${wait} с: следующий скан начнётся в $(date -d @${next} +%H:%M) UTC"
          sleep "$wait"
