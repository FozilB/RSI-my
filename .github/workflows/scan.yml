name: Market Structure Scan

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Показать найденные уведомления в журнале, не отправляя их"
        type: boolean
        default: false
      test_telegram:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: market-structure-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}
          restore-keys: |
            market-structure-state-
      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}
