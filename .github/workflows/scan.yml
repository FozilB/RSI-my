name: Market Structure Scan

on:
  # Резервный запуск. Основной режим - цепочка: каждый запуск сам ставит следующий,
  # потому что расписание GitHub на деле срабатывало раз в ~8 часов вместо каждого часа.
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Показать найденные уведомления в журнале, не отправляя их"
        type: boolean
        default: false
      test_telegram:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

# Интервал цепочки: сразу после закрытия каждой 30m-свечи (в :01 и :31 UTC)
env:
  RUN_EVERY_MIN: "30"
  OFFSET_SEC: "60"

# actions: write нужен, чтобы запуск мог поставить следующий запуск (цепочка)
permissions:
  contents: read
  actions: write

concurrency:
  group: market-structure-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}
          restore-keys: |
            market-structure-state-
      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SCAN_ALL: ${{ inputs.dry_run && '1' || '' }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '' }}
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: market-structure-state-${{ github.run_id }}

      - name: Следующий запуск (цепочка)
        # Следующий запуск ставится сразу и ждёт в очереди (concurrency), пока этот не закончится.
        # Этот запуск досыпает до ближайшего :01/:31 UTC и завершается - следующий стартует ровно после закрытия свечи.
        # Если цепочка оборвётся, её восстановит запуск по расписанию.
        # Тестовые и пробные запуски цепочку не продолжают.
        if: ${{ !cancelled() && !inputs.test_telegram && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          queued=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh workflow run scan.yml --ref "${{ github.ref_name }}"; then
              echo "Следующий запуск поставлен в очередь (попытка $attempt)"
              queued=1
              break
            fi
            echo "Попытка $attempt не удалась, повтор через 30 с"
            sleep 30
          done
          if [ "$queued" != "1" ]; then
            echo "Не удалось поставить следующий запуск. Цепочку восстановит запуск по расписанию."
            exit 1
          fi
          now=$(date +%s)
          period=$(( RUN_EVERY_MIN * 60 ))
          next=$(( ( (now - OFFSET_SEC + period - 1) / period ) * period + OFFSET_SEC ))
          wait=$(( next - now ))
          echo "Жду ${wait} с: следующий скан начнётся в $(date -d @${next} +%H:%M) UTC"
          sleep "$wait"
